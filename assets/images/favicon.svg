<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bub" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset=".35" stop-color="#2ab3d6"/>
      <stop offset=".75" stop-color="#3a3fb8"/>
      <stop offset="1" stop-color="#2a1a6e"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8a96b8"/>
      <stop offset=".3" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#c9d4ea"/>
      <stop offset=".7" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7c86a8"/>
    </linearGradient>
    <linearGradient id="saucer" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#d7e2f5"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2552a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" x2="1">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffb3ec"/>
      <stop offset="1" stop-color="#7afcff"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bub)"/>
    <ellipse cx="22" cy="14" rx="18" ry="9" fill="#ffffff" opacity=".35"/>
    <!-- orbit, back half -->
    <ellipse cx="32" cy="34" rx="27" ry="8" fill="none" stroke="url(#orbit)" stroke-width="2.4" transform="rotate(-14 32 34)" opacity=".55"/>
    <!-- legs -->
    <path d="M29 26 L22 60 L26.5 60 L32 31 L37.5 60 L42 60 L35 26 Z" fill="url(#chrome)" stroke="#1d2366" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M25 46 L39 46" stroke="#1d2366" stroke-width="1.6"/>
    <!-- spire -->
    <rect x="30.6" y="3" width="2.8" height="12" rx="1.2" fill="url(#chrome)" stroke="#1d2366" stroke-width="1"/>
    <!-- saucer -->
    <path d="M14 20 Q32 11 50 20 Q46 26 32 26 Q18 26 14 20 Z" fill="url(#saucer)" stroke="#1d2366" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M18 19.5 Q32 14.5 46 19.5" fill="none" stroke="#ffffff" stroke-width="1.2" opacity=".9"/>
    <!-- orbit, front half -->
    <path d="M6.5 40.5 Q32 50 58.5 27.5" fill="none" stroke="url(#orbit)" stroke-width="2.6" stroke-linecap="round"/>
    <!-- sparkle -->
    <path d="M51 41 Q52 46 56.5 47 Q52 48 51 52.5 Q50 48 45.5 47 Q50 46 51 41 Z" fill="#ffffff"/>
    <circle cx="12" cy="52" r="1.4" fill="#ffffff" opacity=".9"/>
  </g>
</svg>
